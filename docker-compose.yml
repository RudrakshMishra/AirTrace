services:
  db:
    image: postgis/postgis:16-3.4
    container_name: airtrace-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airtrace
      POSTGRES_USER: airtrace
      POSTGRES_PASSWORD: airtrace_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airtrace"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
