[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airtrace"
version = "0.1.0"
description = "AirTrace MP backend – air quality ingestion, source apportionment, and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[postgresql]>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "tenacity>=8.2,<10",
    "PyJWT[crypto]>=2.8,<3",
    "python-telegram-bot>=21,<22",
    "reportlab>=4.1,<5",
    "anthropic>=0.34,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "h3>=4.0,<5",
    "slowapi>=0.1.9,<1",
    "GeoAlchemy2>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx",           # for TestClient
    "ruff>=0.6,<1",
    "coverage>=7,<8",
]

[project.scripts]
airtrace = "airtrace.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/airtrace"]
